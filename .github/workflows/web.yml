name: Build for the web

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the sketch
        uses: actions/checkout@v7
        with:
          path: sketch

      - name: Get openFrameworks 0.12.1
        run: git clone --depth 1 --branch 0.12.1 https://github.com/openframeworks/openFrameworks.git of

      - name: Download openFrameworks web libraries
        run: ./of/scripts/emscripten/download_libs.sh

      - name: Start emscripten
        run: docker run -di --name emscripten -v "$PWD":/src emscripten/emsdk:4.0.4 bash

      - name: Cache the compiled openFrameworks library
        uses: actions/cache@v4
        with:
          path: |
            of/libs/openFrameworksCompiled/lib/emscripten
            of/libs/openFrameworksCompiled/project/emscripten/obj
          key: of-emscripten-0.12.1-emsdk4.0.4-v2

      - name: Build openFrameworks for the web
        run: |
          # If the compiled library was restored from cache, git-cloned sources are newer
          # than the cached objects, which would make `make` recompile everything. Touch the
          # cached outputs (objects, then lib) so make treats them as up to date and skips
          # rebuilding openFrameworks -- turning a ~4 min build into ~1 min.
          if [ -d of/libs/openFrameworksCompiled/project/emscripten/obj ]; then
            find of/libs/openFrameworksCompiled/project/emscripten/obj -type f -exec touch {} + 2>/dev/null || true
            find of/libs/openFrameworksCompiled/lib/emscripten -type f -exec touch {} + 2>/dev/null || true
            echo "restored cached openFrameworks build"
          fi
          sed -i "s/PLATFORM_OPTIMIZATION_CFLAGS_DEBUG = .*/PLATFORM_OPTIMIZATION_CFLAGS_DEBUG = -g0/" of/libs/openFrameworksCompiled/project/emscripten/config.emscripten.default.mk
          docker exec -w /src/of/libs/openFrameworksCompiled/project emscripten emmake make -j4 Release
          # the objects/lib are created as root inside the container; hand them back to the
          # runner so actions/cache can read ALL of them (not just the few world-readable
          # files) when it saves -- otherwise the cache is incomplete and oF recompiles.
          sudo chown -R "$(id -u):$(id -g)" of/libs/openFrameworksCompiled/lib of/libs/openFrameworksCompiled/project 2>/dev/null || true

      - name: Set up the sketch project
        run: |
          mkdir -p of/apps/myApps/sketch/bin/data
          cp -r sketch/src of/apps/myApps/sketch/
          if [ -d sketch/bin/data ]; then cp -r sketch/bin/data/. of/apps/myApps/sketch/bin/data/; fi
          # the web packager fails on an empty data folder, so always keep one small file in it
          echo "web build" > of/apps/myApps/sketch/bin/data/web.txt
          # the prebuilt web libraries expect reallocarray, which this emscripten version leaves out
          cat > of/apps/myApps/sketch/src/web_compat.c <<'EOF'
          #include <stdlib.h>
          #include <stdint.h>
          #include <errno.h>
          void *reallocarray(void *ptr, size_t nmemb, size_t size) {
            if (size != 0 && nmemb > SIZE_MAX / size) { errno = ENOMEM; return NULL; }
            return realloc(ptr, nmemb * size);
          }
          EOF
          cp of/scripts/templates/emscripten/Makefile of/apps/myApps/sketch/
          cp of/scripts/templates/emscripten/config.make of/apps/myApps/sketch/
          ls -la of/apps/myApps/sketch/src

      - name: Build the sketch for the web
        run: |
          docker exec -w /src/of/apps/myApps/sketch emscripten emmake make -j4 Release
          sudo chown -R "$(id -u):$(id -g)" of/apps/myApps/sketch/bin

      - name: Make the page work on GitHub Pages
        run: |
          # openFrameworks web builds use threads (SharedArrayBuffer), which need the
          # cross-origin-isolation headers GitHub Pages can't set, so a service worker adds
          # them in the browser. When web/sw.js is present (this repo) we use our combined
          # worker that ALSO caches the sketch -> installable PWA + offline. Repos created by
          # the uploader have no web/ dir, so they fall back to the stock coi-serviceworker,
          # which just adds the headers (proven path; their sketches still work).
          OUT=of/apps/myApps/sketch/bin/em/sketch
          if [ -f sketch/web/sw.js ]; then
          cp sketch/web/sw.js "$OUT/sw.js"
          sed -i "s/__SW_VERSION__/${GITHUB_SHA:-$(date +%s)}/" "$OUT/sw.js"
          mkdir -p "$OUT/icons"
          cp sketch/web/icons/icon-192.png sketch/web/icons/icon-512.png sketch/web/icons/apple-touch-icon.png sketch/web/icons/icon.svg "$OUT/icons/"
          cat > "$OUT/manifest.webmanifest" <<'JSON'
          { "name":"openFrameworks sketch", "short_name":"oF sketch", "start_url":"./", "scope":"./",
          "display":"standalone", "background_color":"#0d0d11", "theme_color":"#0d0d11",
          "icons":[ {"src":"icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
          {"src":"icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
          {"src":"icons/icon.svg","sizes":"any","type":"image/svg+xml"} ] }
          JSON
          sed -i 's|<head>|<head>\n    <script src="sw.js"></script>\n    <link rel="manifest" href="manifest.webmanifest">\n    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">\n    <meta name="theme-color" content="#0d0d11">|' "$OUT/index.html"
          echo "PWA service worker + manifest injected"
          else
          curl -fsSL -o "$OUT/coi-serviceworker.min.js" https://unpkg.com/coi-serviceworker@0.1.7/coi-serviceworker.min.js
          sed -i 's#<head>#<head>\n    <script src="coi-serviceworker.min.js"></script>#' "$OUT/index.html"
          echo "coi-serviceworker injected (headers only)"
          fi
          grep -nE "sw\.js|coi-serviceworker|manifest" "$OUT/index.html" | head
          # Reskin the page: hide the default emscripten menu/output, center the sketch
          # on a dark stage, and keep one nice glass "Fullscreen" button. Also inject the
          # fullscreen fixes: CSS so a fullscreen canvas fills the screen, and a safe
          # button handler that beats the template's broken pointer-lock one (which throws
          # NotAllowedError and collapses the canvas to 0x0 -> black). Python keeps the
          # multi-line CSS/JS clean (the nodes app.js needs are hidden, never removed).
          python3 - "$OUT/index.html" <<'PY'
          import sys
          p = sys.argv[1]
          style = """  <meta property="og:type" content="website">
          <meta property="og:title" content="openFrameworks sketch">
          <meta property="og:description" content="A creative-coding sketch running in the browser via WebAssembly.">
          <meta property="og:image" content="https://maxfishman.github.io/OpenFrameworksTest/og/og-image.png">
          <meta name="twitter:card" content="summary_large_image">
          <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,">
          <style>
          html,body{margin:0;height:100%;overflow:hidden;background:#0d0d11;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
          /* hide the default emscripten chrome, but keep the nodes app.js references */
          #logo,#spinner,#status,#output,#progress,
          #controls>span:nth-child(1),#controls>span:nth-child(2){display:none!important;}
          #header{position:static!important;background:none!important;border:0!important;
            box-shadow:none!important;margin:0!important;padding:0!important;}
          /* the one control we keep, floated top-right */
          #controls{position:fixed;top:18px;right:18px;z-index:30;margin:0;}
          #fullscreenButton{-webkit-appearance:none;appearance:none;cursor:pointer;
            font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
            color:#fff;letter-spacing:.02em;padding:11px 17px;border-radius:11px;
            background:rgba(22,22,28,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 18px rgba(0,0,0,.35);
            transition:background .15s ease,transform .06s ease,border-color .15s ease;}
          #fullscreenButton:hover{background:rgba(44,44,56,.8);border-color:rgba(255,255,255,.42);}
          #fullscreenButton:active{transform:translateY(1px);}
          #fullscreenButton:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px;}
          /* center the sketch on the stage, scaled to the viewport, 4:3 preserved */
          .emscripten_border{border:0!important;margin:0!important;padding:0!important;
            min-height:100vh;display:flex;align-items:center;justify-content:center;}
          #canvas{display:block;background:#000;aspect-ratio:4/3!important;
            width:min(94vw,calc(92vh*4/3))!important;height:auto!important;
            border-radius:8px;box-shadow:0 14px 60px rgba(0,0,0,.6);}
          #canvas:fullscreen{position:fixed!important;top:0!important;left:0!important;
            width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;
            border-radius:0!important;box-shadow:none!important;}
          /* prominent, dismissable "encode for web" call-to-action over the sketch */
          #ofUploadBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;
            display:flex;align-items:center;gap:14px;text-decoration:none;cursor:pointer;
            font:800 clamp(15px,2.3vw,22px)/1.1 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
            letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#111016;
            padding:18px 26px;border-radius:14px;border:1.5px solid rgba(255,61,110,.65);
            box-shadow:0 12px 46px rgba(255,61,110,.55),0 3px 14px rgba(0,0,0,.55);
            animation:ofpulse 2.2s ease-in-out infinite;}
          #ofUploadBtn:hover{background:#1b1922;border-color:#ff3d6e;transform:translate(-50%,-50%) scale(1.03);}
          #ofUploadBtn .x{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;
            border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:15px;line-height:1;}
          #ofUploadBtn .x:hover{background:#ff3d6e;color:#1a0710;}
          @keyframes ofpulse{0%,100%{box-shadow:0 12px 46px rgba(255,61,110,.45),0 3px 14px rgba(0,0,0,.55)}
            50%{box-shadow:0 12px 66px rgba(255,61,110,.95),0 3px 14px rgba(0,0,0,.55)}}
          @media (prefers-reduced-motion:reduce){#ofUploadBtn{animation:none}}
          /* loading overlay while the WebAssembly downloads/compiles */
          #ofLoading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:22px;background:#0d0d11;transition:opacity .5s ease;}
          #ofLoading.done{opacity:0;pointer-events:none;}
          #ofLoading .of-mark{width:84px;height:84px;animation:ofbob 1.6s ease-in-out infinite;}
          #ofLoading .of-bar{width:min(260px,60vw);height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
          #ofLoading .of-fill{height:100%;width:0;background:#ff3d6e;border-radius:999px;transition:width .3s ease;}
          #ofLoading .of-label{color:#9a98a6;letter-spacing:.04em;
            font:600 13px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
          @keyframes ofbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
          @media (prefers-reduced-motion:reduce){#ofLoading .of-mark{animation:none}}
          </style>
          </head>"""
          script = """  <div id="ofLoading">
          <div class="of-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#ff3c64"/><g transform="translate(10 20.4) scale(0.4)" fill="#fff" fill-rule="evenodd"><path d="M58 29C58 13 45 0 29 0 13 0 0 13 0 29 0 45 13 58 29 58 45 58 58 45 58 29Z"/><rect x="59" width="25" height="58"/><rect x="85" y="26" width="15" height="15"/><path d="M85 0 110 0 85 25 85 0Z"/></g></svg></div>
          <div class="of-bar"><div class="of-fill" id="ofFill"></div></div>
          <div class="of-label" id="ofLabel">Loading sketch&#8230;</div>
          </div>
          <a id="ofUploadBtn" href="https://maxfishman.github.io/OpenFrameworksTest/uploader/" title="Publish your own openFrameworks sketch">
          <span>Click here to encode for web</span>
          <span class="x" id="ofUploadHide" role="button" aria-label="Hide" title="Hide">&times;</span>
          </a>
          <script>
          (function(){
            function go(){
              var c=document.getElementById('canvas'); if(!c) return;
              if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); return; }
              var req=c.requestFullscreen||c.webkitRequestFullscreen; if(req) req.call(c);
            }
            // beat the template's broken handler (pointer-lock -> 0x0 canvas -> black)
            document.addEventListener('click',function(e){
              var t=e.target;
              if(t&&t.id==='fullscreenButton'){ e.stopImmediatePropagation(); e.preventDefault(); go(); }
            },true);
            function label(){
              var b=document.getElementById('fullscreenButton'); if(!b) return;
              b.value = document.fullscreenElement ? '\\u26f6  Exit' : '\\u26f6  Fullscreen';
            }
            document.addEventListener('fullscreenchange',label);
            document.addEventListener('DOMContentLoaded',label);
            label();
          })();
          (function(){
            var KEY='ofUploaderHidden', btn=document.getElementById('ofUploadBtn');
            if(!btn) return;
            try{ if(localStorage.getItem(KEY)) btn.style.display='none'; }catch(e){}
            var x=document.getElementById('ofUploadHide');
            if(x) x.addEventListener('click',function(e){
              e.preventDefault(); e.stopPropagation(); btn.style.display='none';
              try{ localStorage.setItem(KEY,'1'); }catch(e){}
            });
          })();
          (function(){
            var ov=document.getElementById('ofLoading'); if(!ov) return;
            var fill=document.getElementById('ofFill'), label=document.getElementById('ofLabel');
            var st=document.getElementById('status'), pr=document.getElementById('progress');
            var started=false, done=false;
            function hide(){ if(done) return; done=true; if(fill) fill.style.width='100%';
              ov.classList.add('done'); setTimeout(function(){ if(ov&&ov.parentNode) ov.parentNode.removeChild(ov); },600); }
            function upd(){
              if(done) return;
              var txt = st ? (st.textContent||'') : '';
              if(txt){ started=true; if(label) label.textContent=txt; }
              if(pr && pr.max){ if(fill) fill.style.width=Math.min(100,(pr.value/pr.max)*100)+'%'; }
              else { var m=txt.match(/\\((\\d+(?:\\.\\d+)?)\\/(\\d+)\\)/); if(m&&fill) fill.style.width=Math.min(100,(parseFloat(m[1])/parseFloat(m[2]))*100)+'%'; }
              if(/complete/i.test(txt)) setTimeout(hide,1500);     // backup trigger
              if(started && txt===''){ hide(); }                   // emscripten clears status when the app starts
            }
            try{ var mo=new MutationObserver(upd);
              if(st) mo.observe(st,{childList:true,characterData:true,subtree:true});
              if(pr) mo.observe(pr,{attributes:true}); }catch(e){}
            var iv=setInterval(upd,250);
            setTimeout(function(){ clearInterval(iv); hide(); },180000);
            upd();
          })();
          </script>
          </body>"""
          s = open(p).read()
          assert '</head>' in s and '</body>' in s, 'index.html missing head/body'
          s = s.replace('</head>', style, 1).replace('</body>', script, 1)
          open(p,'w').write(s)
          print('reskinned page + injected fullscreen fixes')
          PY
          grep -nE "fullscreenButton|canvas:fullscreen|emscripten_border" "$OUT/index.html" | head
          ls -la "$OUT"

      - name: Publish the uploader page
        run: |
          OUT=of/apps/myApps/sketch/bin/em/sketch
          if [ -d sketch/web/uploader ]; then
            mkdir -p "$OUT/uploader"
            cp -r sketch/web/uploader/. "$OUT/uploader/"
            # stamp the uploader service worker so its cache busts on each deploy
            if [ -f "$OUT/uploader/sw.js" ]; then
              sed -i "s/__SW_VERSION__/${GITHUB_SHA:-$(date +%s)}/" "$OUT/uploader/sw.js"
            fi
            # bundle the CURRENT workflow so repos created by the uploader get all the fixes
            B64=$(base64 -w0 sketch/.github/workflows/web.yml)
            printf 'window.__WEB_YML_B64__=%s;\n' "\"$B64\"" > "$OUT/uploader/workflow.js"
            echo "uploader published:"; ls -la "$OUT/uploader"
          else
            echo "no web/uploader directory in this repo; skipping"
          fi

      - name: Publish the gallery, docs, and shared assets
        run: |
          OUT=of/apps/myApps/sketch/bin/em/sketch
          # copy any of these optional static sections onto the deployed site, if present
          for dir in gallery docs og; do
            if [ -d "sketch/web/$dir" ]; then
              mkdir -p "$OUT/$dir"
              cp -r "sketch/web/$dir/." "$OUT/$dir/"
              echo "published web/$dir"
            fi
          done

      - name: Package the web page
        uses: actions/upload-pages-artifact@v5
        with:
          path: of/apps/myApps/sketch/bin/em/sketch

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
